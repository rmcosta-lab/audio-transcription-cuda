        - generic [ref=e146]:
          - heading "Primary runtime path" [level=3] [ref=e149]
          - list [ref=e150]:
            - listitem [ref=e151]: Input videos ? batch controller ? media stages ? FFmpeg ? MP4/M4A files.
            - listitem [ref=e152]: The controller calls analysis and cut generation before audio extraction; modules share its Python process.
            - listitem [ref=e153]: FFprobe checks for audio and duration. FFmpeg detects silence, encodes cuts, and copies AAC into M4A.
        - generic [ref=e154]:
          - heading "Trust crossings" [level=3] [ref=e157]
          - list [ref=e158]:
            - listitem [ref=e159]: Input media and output folders are operator-selected filesystem paths. Native executables are resolved through PATH.
            - listitem [ref=e160]: Boxes mark process and external-service boundaries, not enforced security groups. No sandbox or privilege isolation is configured in the inspected entry points.
            - listitem [ref=e161]: Transcription delegates model retrieval to faster-whisper; truststore enables OS certificate trust. Model service/cache behavior is documented in transcrever_audio/README.md:22.
        - generic [ref=e162]:
          - heading "Optional transcription" [level=3] [ref=e165]
          - list [ref=e166]:
            - listitem [ref=e167]: The root pipeline stops after extraction. The dashed handoff requires a separate transcrever_audio command.
            - listitem [ref=e168]: One model is reused per batch; CPU/int8 is the default, CUDA is optional. VAD is enabled unless --no-vad is set.
            - listitem [ref=e169]: The transcription CLI writes Markdown; faster-whisper returns segments. Local model-cache details are delegated to the dependency.
        - generic [ref=e170]:
          - heading "Outputs and failure handling" [level=3] [ref=e173]
          - list [ref=e174]:
            - listitem [ref=e175]: The editor also writes timing TXT files. The controller writes relatorio_pipeline.json after each video, including errors and skips.
            - listitem [ref=e176]: Existing media files are protected unless --overwrite is supplied; only cuts from the current run enter extraction.
            - listitem [ref=e177]: Video failures allow the batch to continue. No automatic resume; interrupted work can leave partial files. Optional NVENC affects video encoding.
        - generic [ref=e178]:
          - heading "Evidence scope" [level=3] [ref=e181]
