        - generic [ref=f1e146]:
          - heading "Primary runtime path" [level=3] [ref=f1e149]
          - list [ref=f1e150]:
            - listitem [ref=f1e151]: Input videos ? batch controller ? media stages ? FFmpeg ? MP4/M4A files.
            - listitem [ref=f1e152]: The controller calls analysis and cut generation before audio extraction; modules share its Python process.
            - listitem [ref=f1e153]: FFprobe checks for audio and duration. FFmpeg detects silence, encodes cuts, and copies AAC into M4A.
        - generic [ref=f1e154]:
          - heading "Trust crossings" [level=3] [ref=f1e157]
          - list [ref=f1e158]:
            - listitem [ref=f1e159]: Input media and output folders are operator-selected filesystem paths. Native executables are resolved through PATH.
            - listitem [ref=f1e160]: Boxes mark process and external-service boundaries, not enforced security groups. No sandbox or privilege isolation is configured in the inspected entry points.
            - listitem [ref=f1e161]: Transcription delegates model retrieval to faster-whisper; truststore enables OS certificate trust. Model service/cache behavior is documented in transcrever_audio/README.md:22.
        - generic [ref=f1e162]:
          - heading "Optional transcription" [level=3] [ref=f1e165]
          - list [ref=f1e166]:
            - listitem [ref=f1e167]: The root pipeline stops after extraction. The dashed handoff requires a separate transcrever_audio command.
            - listitem [ref=f1e168]: One model is reused per batch; CPU/int8 is the default, CUDA is optional. VAD is enabled unless --no-vad is set.
            - listitem [ref=f1e169]: The transcription CLI writes Markdown; faster-whisper returns segments. Local model-cache details are delegated to the dependency.
        - generic [ref=f1e170]:
          - heading "Outputs and failure handling" [level=3] [ref=f1e173]
          - list [ref=f1e174]:
            - listitem [ref=f1e175]: The editor also writes timing TXT files. The controller writes relatorio_pipeline.json after each video, including errors and skips.
            - listitem [ref=f1e176]: Existing media files are protected unless --overwrite is supplied; only cuts from the current run enter extraction.
            - listitem [ref=f1e177]: Video failures allow the batch to continue. No automatic resume; interrupted work can leave partial files. Optional NVENC affects video encoding.
