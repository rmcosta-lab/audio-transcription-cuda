[project]
name = "audio-transcription-cuda"
version = "0.1.0"
description = "Pipeline em lote para cortar videos, extrair audio e transcrever com Whisper."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
transcricao = [
    "faster-whisper>=1.2.1,<2",
    "truststore>=0.10,<1",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["cola.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
